services:
  db:
    image: postgres:16-alpine
    container_name: fixtrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixtrack
      POSTGRES_USER: fixtrack
      POSTGRES_PASSWORD: fixtrack
    ports:
      - "5432:5432"
    volumes:
      - fixtrack_postgres_data:/var/lib/postgresql/data

volumes:
  fixtrack_postgres_data:
